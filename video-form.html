<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Form — Video Admin</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <div class="app-main">
      <header id="app-header" class="app-header"></header>

      <main class="app-content">
        <div class="video-form-layout">
          <!-- Left: Main Form Card -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Video Information</h2>
              <span style="font-size: var(--font-size-xs); color: var(--color-text-muted);">* Required fields</span>
            </div>

            <form id="video-form" class="card-body" novalidate>
              <!-- Title -->
              <div class="form-group">
                <label for="video-title" class="form-label">
                  Video Title <span class="required">*</span>
                </label>
                <input 
                  type="text" 
                  id="video-title" 
                  class="form-input" 
                  placeholder="e.g. Building Modern Web Apps with Vanilla JS" 
                  required
                >
                <div id="video-title-error" class="form-error">Please enter a video title.</div>
              </div>

              <!-- Category & File Size Grid -->
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label for="video-category" class="form-label">Category</label>
                  <select id="video-category" class="form-select">
                    <!-- Populated dynamically -->
                  </select>
                </div>

                <div class="form-group">
                  <label for="video-size" class="form-label">File Size (MB)</label>
                  <input 
                    type="number" 
                    id="video-size" 
                    class="form-input" 
                    placeholder="e.g. 450" 
                    min="0"
                  >
                </div>
              </div>

              <!-- Thumbnail URL -->
              <div class="form-group">
                <label for="video-thumbnail" class="form-label">Thumbnail URL</label>
                <input 
                  type="url" 
                  id="video-thumbnail" 
                  class="form-input" 
                  placeholder="https://images.unsplash.com/..."
                >
                <div class="form-helper">Enter a direct image URL or leave blank for a placeholder.</div>
              </div>

              <!-- Video Source URL -->
              <div class="form-group">
                <label for="video-url" class="form-label">Video URL / Source</label>
                <input 
                  type="text" 
                  id="video-url" 
                  class="form-input" 
                  placeholder="https://example.com/videos/stream.mp4"
                >
              </div>

              <!-- Tags -->
              <div class="form-group">
                <label for="video-tags" class="form-label">Tags</label>
                <input 
                  type="text" 
                  id="video-tags" 
                  class="form-input" 
                  placeholder="e.g. JavaScript, CSS, Tutorial (comma separated)"
                >
                <div class="form-helper">Separate multiple tags with commas.</div>
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="video-description" class="form-label">Description</label>
                <textarea 
                  id="video-description" 
                  class="form-textarea" 
                  placeholder="Enter a brief summary of what this video covers..."
                ></textarea>
              </div>

              <!-- Actions -->
              <div style="display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--color-border);">
                <a href="videos.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                  </svg>
                  <span>Save Video</span>
                </button>
              </div>
            </form>
          </div>

          <!-- Right: Live Preview Card -->
          <div class="preview-card card">
            <div class="card-header">
              <h3 class="card-title">Live Preview</h3>
              <span class="badge badge-primary">Preview</span>
            </div>

            <div class="preview-media">
              <img id="preview-img" class="preview-img" src="" alt="Thumbnail preview" style="display: none;" />
              <div id="preview-placeholder" class="preview-placeholder">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>No thumbnail provided</span>
              </div>
              <div class="preview-duration-badge">HD</div>
            </div>

            <div class="preview-info">
              <div class="preview-meta">
                <span id="preview-category" class="badge badge-secondary">General</span>
                <span>•</span>
                <span>0 views</span>
              </div>
              <h4 id="preview-title" class="preview-title">Untitled Video</h4>
              <p id="preview-desc" class="preview-desc">No description provided yet.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { VideoFormPage } from './assets/js/pages/video-form.js';
    document.addEventListener('DOMContentLoaded', () => {
      VideoFormPage.init();
    });
  </script>
</body>
</html>
