<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu mới — Video Admin</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="auth-page-body">
  <div class="auth-container">
    <div class="auth-card">

      <!-- Brand Header -->
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <span>VideoAdmin</span>
        </a>
        <h2 class="auth-title">Tạo mật khẩu mới</h2>
        <p class="auth-subtitle">Nhập mật khẩu mới an toàn cho tài khoản của bạn</p>
      </div>

      <!-- Token Validation Loading State -->
      <div id="reset-loading-state" class="demo-alert" style="background-color: var(--color-surface-muted); border-color: var(--color-border); color: var(--color-text-muted);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
        </svg>
        <div>Đang xác thực liên kết khôi phục từ Supabase...</div>
      </div>

      <!-- Invalid/Expired Token Error State -->
      <div id="reset-error-state" class="demo-alert" style="display: none; background-color: var(--color-danger-bg); border-color: rgba(214, 69, 69, 0.3); color: var(--color-danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <div>
          <strong>Liên kết không hợp lệ hoặc đã hết hạn!</strong><br>
          <span style="font-size: var(--font-size-xs);">Vui lòng quay lại trang Quên mật khẩu để gửi lại yêu cầu mới.</span>
          <div style="margin-top: 0.75rem;">
            <a href="forgot-password.html" class="btn btn-outline btn-sm" style="display: inline-block;">Gửi lại email khôi phục</a>
          </div>
        </div>
      </div>

      <!-- Reset Password Form -->
      <form id="reset-password-form" style="display: none;" novalidate>
        <!-- New Password -->
        <div class="form-group">
          <label for="new-password" class="form-label">Mật khẩu mới <span class="required">*</span></label>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="new-password" 
              class="form-input" 
              placeholder="Ít nhất 6 ký tự" 
              required
              autocomplete="new-password"
            >
            <button type="button" id="toggle-new-password" class="btn-toggle-password" aria-label="Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <!-- Strength Indicator -->
          <div id="password-strength-indicator" style="font-size: var(--font-size-xs); font-weight: 500; margin-top: 0.3rem;"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-new-password" class="form-label">Xác nhận mật khẩu mới <span class="required">*</span></label>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="confirm-new-password" 
              class="form-input" 
              placeholder="Nhập lại mật khẩu mới" 
              required
              autocomplete="new-password"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-block" style="padding: 0.75rem; margin-top: 1.25rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span id="reset-btn-text">Lưu mật khẩu mới</span>
        </button>
      </form>

      <div class="auth-footer" style="margin-top: 1.5rem; text-align: center; font-size: var(--font-size-sm);">
        <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Quay lại Đăng nhập</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { ResetPasswordPage } from './assets/js/pages/reset-password.js';
    document.addEventListener('DOMContentLoaded', () => {
      ResetPasswordPage.init();
    });
  </script>
</body>
</html>
