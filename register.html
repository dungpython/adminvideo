<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản — Video Admin</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="auth-page-body">
  <div class="auth-container">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <span>VideoAdmin</span>
        </a>
        <h2 class="auth-title">Tạo tài khoản</h2>
        <p class="auth-subtitle">Đăng ký tài khoản quản trị viên mới</p>
      </div>

      <!-- Notice -->
      <div class="demo-alert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div>
          <strong>Lưu ý:</strong> Tài khoản mới sẽ có quyền <strong>USER</strong> mặc định.
          Chỉ ADMIN mới có thể nâng quyền sau khi đăng ký.
          Dữ liệu được đồng bộ lên Supabase Cloud khi có kết nối.
        </div>
      </div>

      <!-- Register Form -->
      <form id="register-form" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="register-name" class="form-label">Họ và tên <span class="required">*</span></label>
          <input
            type="text"
            id="register-name"
            class="form-input"
            placeholder="Ví dụ: Nguyễn Văn A"
            required
            autocomplete="name"
          >
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="register-email" class="form-label">Địa chỉ email <span class="required">*</span></label>
          <input
            type="email"
            id="register-email"
            class="form-input"
            placeholder="email@example.com"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="register-password" class="form-label">Mật khẩu <span class="required">*</span></label>
          <div class="input-password-wrapper">
            <input
              type="password"
              id="register-password"
              class="form-input"
              placeholder="Ít nhất 6 ký tự"
              required
              autocomplete="new-password"
            >
            <button type="button" id="toggle-password-btn" class="btn-toggle-password" aria-label="Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <!-- Password strength indicator -->
          <span id="password-strength" style="font-size:var(--font-size-xs);margin-top:0.3rem;display:block;font-weight:500;"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Xác nhận mật khẩu <span class="required">*</span></label>
          <input
            type="password"
            id="register-confirm-password"
            class="form-input"
            placeholder="Nhập lại mật khẩu"
            required
            autocomplete="new-password"
          >
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-block" style="padding:0.75rem;margin-top:1rem;">
          Tạo tài khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { RegisterPage } from './assets/js/pages/register.js';
    document.addEventListener('DOMContentLoaded', () => {
      RegisterPage.init();
    });
  </script>
</body>
</html>
