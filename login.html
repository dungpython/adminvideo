<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Video Admin</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="auth-page-body">
  <div class="auth-container">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <span>VideoAdmin</span>
        </a>
        <h2 class="auth-title">Chào mừng trở lại</h2>
        <p class="auth-subtitle">Đăng nhập để quản lý thư viện video của bạn</p>
      </div>

      <!-- Demo credentials hint -->
      <div class="demo-alert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div>
          <strong>Tài khoản demo — click để điền:</strong><br>
          <span style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">
            <button type="button" class="demo-chip"
              data-fill-email="admin@example.com" data-fill-pass="admin123"
              style="padding:0.2rem 0.6rem;font-size:0.7rem;border:1px solid rgba(217,138,22,.4);border-radius:999px;background:transparent;cursor:pointer;color:inherit;">
              👑 admin@example.com
            </button>
            <button type="button" class="demo-chip"
              data-fill-email="user1@demo.com" data-fill-pass="user123"
              style="padding:0.2rem 0.6rem;font-size:0.7rem;border:1px solid rgba(217,138,22,.4);border-radius:999px;background:transparent;cursor:pointer;color:inherit;">
              👤 user1@demo.com
            </button>
          </span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label for="login-email" class="form-label">Địa chỉ email</label>
          <input
            type="email"
            id="login-email"
            class="form-input"
            placeholder="admin@example.com"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="login-password" class="form-label">Mật khẩu</label>
          <div class="input-password-wrapper">
            <input
              type="password"
              id="login-password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
            <button type="button" id="toggle-password-btn" class="btn-toggle-password" aria-label="Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="auth-extra-row">
          <label class="form-checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>Ghi nhớ phiên</span>
          </label>
          <a href="forgot-password.html" style="color:var(--color-primary);font-size:var(--font-size-xs);font-weight:500;">
            Quên mật khẩu?
          </a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-block" style="padding:0.75rem;margin-top:0.5rem;">
          Đăng nhập
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { LoginPage } from './assets/js/pages/login.js';
    document.addEventListener('DOMContentLoaded', () => {
      LoginPage.init();
    });
  </script>
</body>
</html>
